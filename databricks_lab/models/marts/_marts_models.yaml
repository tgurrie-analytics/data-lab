version: 2

models:
  - name: dim_products
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: dim_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: fct_order_lines
    columns:
      - name: line_id
        tests: [unique, not_null]
      - name: product_id
        tests:
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

  - name: fct_orders
    columns:
      - name: order_id
        tests: [unique, not_null]